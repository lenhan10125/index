<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .error-message {
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <noscript>
            <div class="error-message">
                <h2>Cần bật JavaScript</h2>
                <p>Trang này cần JavaScript để hoạt động. Vui lòng bật JavaScript trong trình duyệt rồi tải lại trang.</p>
            </div>
        </noscript>

        <div id="js-content">
            <h2>Đang chuyển hướng...</h2>
            <p>Vui lòng đợi trong giây lát.</p>
        </div>
    </div>
    <script>
        window.location.href = "https://hentaiorc.xyz/home";
    </script>
</body>
</html>
